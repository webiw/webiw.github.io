<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-label="Les Coquillettes Quantiques - Seule en scène musical de Gaëlle Pinheiro">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#19132B"/>
      <stop offset="58%" stop-color="#120E20"/>
      <stop offset="100%" stop-color="#221734"/>
    </linearGradient>
    <linearGradient id="bannerTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F062A6"/>
      <stop offset="55%" stop-color="#F69E7B"/>
      <stop offset="100%" stop-color="#F7C96E"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="54%" r="48%">
      <stop offset="0%" stop-color="#FF66C4" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#F3B340" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#120E20" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <circle cx="450" cy="640" r="420" fill="url(#spot)"/>

  <!-- Ruban supérieur inspiré du visuel de sortie de résidence -->
  <path d="M0 0 L900 0 L900 220 C680 210 460 115 0 210 Z" fill="url(#bannerTop)"/>
  <path d="M0 175 C360 95 620 185 900 198 L900 232 C610 212 350 122 0 206 Z" fill="#19132B"/>

  <text x="450" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#19132B" letter-spacing="4">LA COMPAGNIE O’DÉTOUR PRÉSENTE</text>
  <rect x="250" y="82" width="400" height="46" rx="23" fill="#FFFDF9"/>
  <text x="450" y="113" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#C82873" letter-spacing="2">SEULE EN SCÈNE MUSICAL</text>

  <!-- Titre principal -->
  <text x="450" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="68" font-weight="700" fill="#FFFDF9" letter-spacing="-1">Les Coquillettes</text>
  <text x="450" y="388" text-anchor="middle" font-family="Georgia, serif" font-size="76" font-weight="700" fill="#FF66C4" letter-spacing="-1">Quantiques</text>
  <text x="450" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="600" fill="#E8DFD1" letter-spacing="1.5">DE ET AVEC GAËLLE PINHEIRO</text>

  <!-- Scénographie : malles et valises de théâtre empilées sous les projecteurs -->
  <g transform="translate(0, 30)">
    <!-- Sol de scène -->
    <ellipse cx="450" cy="865" rx="340" ry="34" fill="#0B0814" opacity="0.85"/>
    <!-- Malle verticale arrière gauche -->
    <rect x="255" y="540" width="128" height="290" rx="8" fill="#5D3A24" stroke="#8C5B3C" stroke-width="3"/>
    <rect x="275" y="500" width="88" height="40" rx="5" fill="#9E9589" stroke="#C7BEB2" stroke-width="2"/>
    <!-- Malle arrière droite -->
    <rect x="520" y="610" width="160" height="215" rx="8" fill="#6E472D" stroke="#9B6B47" stroke-width="3"/>
    <line x1="520" y1="680" x2="680" y2="680" stroke="#3E2515" stroke-width="4"/>
    <rect x="540" y="572" width="115" height="38" rx="5" fill="#4A3222" stroke="#7A553C" stroke-width="2"/>
    <!-- Valise centrale au premier plan -->
    <rect x="382" y="645" width="136" height="215" rx="10" fill="#2A1F1D" stroke="#59433E" stroke-width="3"/>
    <rect x="438" y="675" width="24" height="16" rx="3" fill="#D99B4E"/>
    <rect x="438" y="745" width="24" height="16" rx="3" fill="#D99B4E"/>
    <rect x="438" y="815" width="24" height="16" rx="3" fill="#D99B4E"/>
    <!-- Valises posées au sol -->
    <rect x="135" y="785" width="155" height="68" rx="8" fill="#8B5A36" stroke="#B87D52" stroke-width="3"/>
    <rect x="615" y="790" width="155" height="64" rx="8" fill="#845330" stroke="#B2774B" stroke-width="3"/>
    <!-- Silhouette stylisée en équilibre / envol en robe rose vif -->
    <path d="M150 618 C255 612 355 628 450 615 C525 604 600 595 675 608 L675 636 C590 634 520 652 440 650 C330 654 235 660 145 648 Z" fill="#FF3B8B"/>
    <circle cx="635" cy="576" r="28" fill="#F4C7A5"/>
    <path d="M612 562 C620 542 652 544 660 566 C650 558 626 558 612 562 Z" fill="#8C583A"/>
    <!-- Touches de piano et onde sonore dorée -->
    <path d="M180 515 Q310 465 450 510 T720 495" fill="none" stroke="#F7C96E" stroke-width="3" stroke-dasharray="8 8" opacity="0.8"/>
    <circle cx="240" cy="495" r="6" fill="#F7C96E"/>
    <circle cx="450" cy="510" r="7" fill="#FF66C4"/>
    <circle cx="665" cy="498" r="6" fill="#F7C96E"/>
  </g>

  <!-- Crédits artistiques -->
  <text x="450" y="968" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#F7C96E" letter-spacing="1">MISE EN SCÈNE : GUILLAUME NOZACH</text>
  <text x="450" y="1006" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" fill="#D5CBE6">Avec la complicité d’Alexandre Gicquel · Création sonore et piano : Vinh Giang Vo Van</text>
  <text x="450" y="1038" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" fill="#D5CBE6">Composition : Xavier Prêtre · Photographies : Guillaume Ménant</text>

  <!-- Ruban inférieur -->
  <path d="M0 1085 C290 1165 610 1165 900 1095 L900 1200 L0 1200 Z" fill="url(#bannerTop)"/>
  <text x="450" y="1162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#19132B" letter-spacing="2">LA PASSERELLE (THEIX-NOYALO) · FESTIVAL D’EAUZE</text>
</svg>
