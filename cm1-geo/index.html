<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Entraînement Interactif - Géographie CM1</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    font-family: 'Segoe UI', system-ui, Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
    padding: 14px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  .topbar {
    width: 100%;
    max-width: 1080px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  h1 { font-size: 20px; font-weight: 800; color: #0f172a; }
  .instructions { font-size: 14px; color: #475569; margin-top: 2px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    color: #1e293b;
    transition: all 0.15s;
  }
  button:hover { background: #f8fafc; border-color: #94a3b8; }
  button.primary { background: #2563eb; color: #ffffff; border-color: #1d4ed8; }
  button.primary:hover { background: #1d4ed8; }
  .score-pill {
    padding: 7px 14px;
    border-radius: 20px;
    background: #dbeafe;
    color: #1e40af;
    font-weight: 800;
    font-size: 14px;
  }
  .board {
    position: relative;
    width: 100%;
    max-width: 1080px;
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .labels-row {
    display: grid;
    gap: 8px;
    z-index: 3;
  }
  .labels-top { grid-template-columns: repeat(8, 1fr); }
  .labels-bot { grid-template-columns: repeat(9, 1fr); }
  .lbl-card {
    background: #f8fafc;
    border: 2px solid #64748b;
    border-radius: 9px;
    padding: 7px 4px;
    text-align: center;
    font-weight: 700;
    font-size: 12px;
    line-height: 1.2;
    cursor: pointer;
    min-height: 46px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: transform 0.12s, background 0.12s, border-color 0.12s;
  }
  .lbl-card.ocean { font-size: 10.8px; letter-spacing: 0.2px; }
  .lbl-card:hover { transform: translateY(-2px); border-color: #2563eb; }
  .lbl-card.selected { background: #dbeafe; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.25); }
  .lbl-card.linked { background: #e0f2fe; border-color: #0284c7; }
  .lbl-card.correct { background: #dcfce7; border-color: #16a34a; color: #14532d; }
  .lbl-card.wrong { background: #fee2e2; border-color: #dc2626; color: #7f1d1d; }
  .map-wrap {
    position: relative;
    width: 100%;
  }
  .map-svg {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
    border: 2px solid #64748b;
  }
  .target-dot {
    cursor: pointer;
    transition: r 0.15s;
  }
  .target-dot:hover {
    fill: #2563eb;
  }
  #lines-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 4;
  }
  .legend-bar {
    display: flex;
    gap: 22px;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .swatch {
    display: inline-block;
    width: 20px;
    height: 14px;
    border-radius: 3px;
    border: 1px solid #475569;
    vertical-align: middle;
    margin-right: 6px;
  }

  button, .lbl-card, .map-svg { touch-action: manipulation; }
  @media (max-width: 860px) {
    body { padding: 10px; }
    .board { padding: 12px; gap: 14px; }
    .labels-top { grid-template-columns: repeat(4, 1fr); }
    .labels-bot { grid-template-columns: repeat(3, 1fr); }
    h1 { font-size: 17px; }
  }
</style>
</head>

const ITEMS = [{"id": "am_nord", "label": "Amérique du Nord", "lines": ["Amérique", "du Nord"], "cat": "continent", "row": "top", "tx": 251.5, "ty": 88.0}, {"id": "etats_unis", "label": "États-Unis", "lines": ["États-Unis"], "cat": "rich", "row": "top", "tx": 234.2, "ty": 130.4}, {"id": "haiti", "label": "Haïti", "lines": ["Haïti"], "cat": "poor", "row": "top", "tx": 282.5, "ty": 181.7}, {"id": "oc_arctique", "label": "OCÉAN GLACIAL ARCTIQUE", "lines": ["OCÉAN GLACIAL", "ARCTIQUE"], "cat": "ocean", "row": "top", "tx": 489.7, "ty": 33.1}, {"id": "france", "label": "France", "lines": ["France"], "cat": "rich", "row": "top", "tx": 478.6, "ty": 111.2}, {"id": "europe", "label": "Europe", "lines": ["Europe"], "cat": "continent", "row": "top", "tx": 523.2, "ty": 92.9}, {"id": "asie", "label": "Asie", "lines": ["Asie"], "cat": "continent", "row": "top", "tx": 683.2, "ty": 102.7}, {"id": "oc_pacifique_e", "label": "OCÉAN PACIFIQUE", "lines": ["OCÉAN", "PACIFIQUE"], "cat": "ocean", "row": "top", "tx": 890.1, "ty": 189.3}, {"id": "oc_pacifique_o", "label": "OCÉAN PACIFIQUE", "lines": ["OCÉAN", "PACIFIQUE"], "cat": "ocean", "row": "bottom", "tx": 117.1, "ty": 250.9}, {"id": "am_sud", "label": "Amérique du Sud", "lines": ["Amérique", "du Sud"], "cat": "continent", "row": "bottom", "tx": 314.4, "ty": 268.8}, {"id": "oc_atlantique", "label": "OCÉAN ATLANTIQUE", "lines": ["OCÉAN", "ATLANTIQUE"], "cat": "ocean", "row": "bottom", "tx": 424.6, "ty": 291.9}, {"id": "tchad", "label": "Tchad", "lines": ["Tchad"], "cat": "poor", "row": "bottom", "tx": 518.4, "ty": 190.9}, {"id": "afrique", "label": "Afrique", "lines": ["Afrique"], "cat": "continent", "row": "bottom", "tx": 530.1, "ty": 245.7}, {"id": "oc_antarctique", "label": "OCÉAN GLACIAL ANTARCTIQUE", "lines": ["OCÉAN GLACIAL", "ANTARCTIQUE"], "cat": "ocean", "row": "bottom", "tx": 501.0, "ty": 386.8}, {"id": "antarctique", "label": "Antarctique", "lines": ["Antarctique"], "cat": "continent", "row": "bottom", "tx": 510.4, "ty": 426.1}, {"id": "oc_indien", "label": "OCÉAN INDIEN", "lines": ["OCÉAN", "INDIEN"], "cat": "ocean", "row": "bottom", "tx": 671.3, "ty": 281.6}, {"id": "oceanie", "label": "Océanie", "lines": ["Océanie"], "cat": "continent", "row": "bottom", "tx": 812.5, "ty": 294.5}];
let selectedLabelId = null;
let links = {}; // labelId -> targetId
let checked = false;
let showCountryColors = true;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initBoard(reshuffle = true) {
  const topRow = document.getElementById('row-top');
  const botRow = document.getElementById('row-bot');
  topRow.innerHTML = '';
  botRow.innerHTML = '';

  let topItems = ITEMS.filter(x => x.row === 'top');
  let botItems = ITEMS.filter(x => x.row === 'bottom');
  if (reshuffle) {
    topItems = shuffle(topItems);
    botItems = shuffle(botItems);
  }

  for (const it of topItems) topRow.appendChild(makeCard(it));
  for (const it of botItems) botRow.appendChild(makeCard(it));

  const tLayer = document.getElementById('targets-layer');
  tLayer.innerHTML = '';
  for (const it of ITEMS) {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    const hit = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    hit.setAttribute('cx', it.tx);
    hit.setAttribute('cy', it.ty);
    hit.setAttribute('r', '22');
    hit.setAttribute('fill', 'transparent');
    hit.style.cursor = 'pointer';

    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('cx', it.tx);
    dot.setAttribute('cy', it.ty);
    dot.setAttribute('r', '6.5');
    dot.setAttribute('fill', '#ffffff');
    dot.setAttribute('stroke', '#1e293b');
    dot.setAttribute('stroke-width', '2.2');
    dot.setAttribute('id', 'dot-' + it.id);
    dot.classList.add('target-dot');

    g.appendChild(hit);
    g.appendChild(dot);
    g.addEventListener('click', () => onTargetClick(it.id));
    tLayer.appendChild(g);
  }
  redrawLines();
}

function makeCard(it) {
  const div = document.createElement('div');
  div.className = 'lbl-card' + (it.cat === 'ocean' ? ' ocean' : '');
  div.id = 'card-' + it.id;
  div.innerHTML = it.lines.join('<br>');
  div.addEventListener('click', () => onCardClick(it.id));
  return div;
}

function onCardClick(id) {
  if (checked) { checked = false; clearCheckStyles(); }
  if (selectedLabelId === id) {
    selectedLabelId = null;
  } else {
    selectedLabelId = id;
  }
  updateUI();
}

function onTargetClick(targetId) {
  if (!selectedLabelId) {
    // If clicking an already linked target, remove that link
    for (const [k, v] of Object.entries(links)) {
      if (v === targetId) { delete links[k]; updateUI(); return; }
    }
    document.getElementById('status-msg').textContent = "Clique d'abord sur une étiquette en haut ou en bas !";
    return;
  }
  if (checked) { checked = false; clearCheckStyles(); }
  // Remove any previous label pointing to this target
  for (const [k, v] of Object.entries(links)) {
    if (v === targetId) delete links[k];
  }
  links[selectedLabelId] = targetId;
  selectedLabelId = null;
  updateUI();
}

function clearCheckStyles() {
  document.querySelectorAll('.lbl-card').forEach(el => el.classList.remove('correct', 'wrong'));
}

function isMatchCorrect(labelId, targetId) {
  if (!targetId) return false;
  if (labelId === targetId) return true;
  // Both Pacific Ocean labels are interchangeable!
  const lItem = ITEMS.find(x => x.id === labelId);
  const tItem = ITEMS.find(x => x.id === targetId);
  return lItem && tItem && lItem.label === tItem.label;
}

function updateUI() {
  document.querySelectorAll('.lbl-card').forEach(el => {
    const id = el.id.replace('card-', '');
    el.classList.toggle('selected', id === selectedLabelId);
    el.classList.toggle('linked', Boolean(links[id]) && id !== selectedLabelId);
  });
  const count = Object.keys(links).length;
  document.getElementById('score-pill').textContent = count + ' / 17 reliés';
  if (selectedLabelId) {
    const item = ITEMS.find(x => x.id === selectedLabelId);
    document.getElementById('status-msg').textContent = 'Étiquette choisie : "' + item.label + '" -> clique maintenant sur le bon point sur la carte.';
  } else {
    document.getElementById('status-msg').textContent = 'Clique sur une étiquette, puis sur le point correspondant de la carte.';
  }
  redrawLines();
}

function redrawLines() {
  const svg = document.getElementById('lines-overlay');
  const boardRect = document.getElementById('board').getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${boardRect.width} ${boardRect.height}`);
  svg.innerHTML = '';

  for (const [labelId, targetId] of Object.entries(links)) {
    const card = document.getElementById('card-' + labelId);
    const dot = document.getElementById('dot-' + targetId);
    if (!card || !dot) continue;
    const cRect = card.getBoundingClientRect();
    const dRect = dot.getBoundingClientRect();
    const lItem = ITEMS.find(x => x.id === labelId);

    const x1 = cRect.left + cRect.width / 2 - boardRect.left;
    const y1 = (lItem.row === 'top' ? cRect.bottom : cRect.top) - boardRect.top;
    const x2 = dRect.left + dRect.width / 2 - boardRect.left;
    const y2 = dRect.top + dRect.height / 2 - boardRect.top;

    let stroke = '#2563eb';
    if (checked) {
      stroke = isMatchCorrect(labelId, targetId) ? '#16a34a' : '#dc2626';
    }

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1);
    line.setAttribute('y1', y1);
    line.setAttribute('x2', x2);
    line.setAttribute('y2', y2);
    line.setAttribute('stroke', stroke);
    line.setAttribute('stroke-width', '2.5');
    svg.appendChild(line);
  }
}

function checkAnswers() {
  checked = true;
  let good = 0;
  for (const it of ITEMS) {
    const card = document.getElementById('card-' + it.id);
    card.classList.remove('correct', 'wrong');
    const tId = links[it.id];
    if (isMatchCorrect(it.id, tId)) {
      card.classList.add('correct');
      good++;
    } else if (tId) {
      card.classList.add('wrong');
    }
  }
  document.getElementById('score-pill').textContent = 'Score : ' + good + ' / 17';
  if (good === 17) {
    document.getElementById('status-msg').textContent = 'Bravo ! Sans-faute : 17 / 17 !';
  } else {
    document.getElementById('status-msg').textContent = good + ' bonnes réponses sur 17. Les erreurs sont en rouge : clique dessus pour les corriger !';
  }
  redrawLines();
}

function resetGame(reshuffle) {
  links = {};
  selectedLabelId = null;
  checked = false;
  initBoard(reshuffle);
  document.getElementById('score-pill').textContent = '0 / 17 reliés';
  document.getElementById('status-msg').textContent = 'C\'est reparti ! Clique sur une étiquette puis sur le bon endroit de la carte.';
}

function toggleColors() {
  showCountryColors = !showCountryColors;
  const richFill = showCountryColors ? '#7ca832' : '#ffffff';
  const richStroke = showCountryColors ? '#4b6b16' : '#1e293b';
  const poorFill = showCountryColors ? '#e66c2c' : '#ffffff';
  const poorStroke = showCountryColors ? '#a3410e' : '#1e293b';

  for (const id of ['p-usa', 'p-france']) {
    document.getElementById(id).setAttribute('fill', richFill);
    document.getElementById(id).setAttribute('stroke', richStroke);
  }
  for (const id of ['p-chad', 'p-haiti']) {
    document.getElementById(id).setAttribute('fill', poorFill);
    document.getElementById(id).setAttribute('stroke', poorStroke);
  }
  document.getElementById('c-haiti').setAttribute('fill', poorFill);
  document.getElementById('c-haiti').setAttribute('stroke', showCountryColors ? '#ffffff' : '#1e293b');
  document.getElementById('sw-rich').style.background = richFill;
  document.getElementById('sw-poor').style.background = poorFill;
  document.getElementById('btn-colors').textContent = showCountryColors ? 'Masquer les couleurs des pays' : 'Afficher les couleurs des pays';
}

window.addEventListener('resize', redrawLines);
initBoard(true);
</script>
</body>
</html>
